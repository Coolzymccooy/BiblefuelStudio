<!--
  No bg-/text- utilities here. `bg-dark-950` and `text-gray-100` were
  hardcoded theme-blind values, and because a utility class outranks the
  themed `body` rule in index.css, they painted EVERY theme with the dark
  theme's ground (#080604) and ink. Calm in particular rendered as dark no
  matter what its own tokens said. The ground and ink now come from
  `body { background-color: var(--bf-bg); color: ... }`, which each theme
  redefines.
-->
